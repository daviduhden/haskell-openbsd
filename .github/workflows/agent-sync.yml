name: Agent knowledge synchronization

on:
  pull_request:

permissions: {}

concurrency:
  group: agent-sync-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  agent-sync:
    name: Validate agent and skill maintenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check agent and skill synchronization
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check-agent-sync.py --base "$BASE_SHA" --head "$HEAD_SHA"
